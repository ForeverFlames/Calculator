<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="calculator">

  <div id="display">
    <div class="screen" id="input"></div>
    <div class="screen" id="output"></div>
  </div>

  <div id="keys">
    <div class="key num" onclick="press('7')">7</div>
    <div class="key num" onclick="press('8')">8</div>
    <div class="key num" onclick="press('9')">9</div>
    <div class="key op" onclick="press('^')">^</div>
    <div class="key fn wide" onclick="press('+')">+</div>

    <div class="key num" onclick="press('4')">4</div>
    <div class="key num" onclick="press('5')">5</div>
    <div class="key num" onclick="press('6')">6</div>
    <div class="key op" onclick="press('/')">/</div>
    <div class="key fn wide" onclick="press('%')">%</div>

    <div class="key num" onclick="press('1')">1</div>
    <div class="key num" onclick="press('2')">2</div>
    <div class="key num" onclick="press('3')">3</div>
    <div class="key op" onclick="press('*')">*</div>
    <div class="key fn" onclick="press('(')">(</div>
    <div class="key fn" onclick="press(')')">)</div>

    <div class="key num" onclick="press('.')">.</div>
    <div class="key num" onclick="press('0')">0</div>
    <div class="key num" onclick="calculate()">=</div>
    <div class="key op" onclick="press('-')">-</div>
    <div class="key fn" onclick="goBack()">L</div>
    <div class="key fn" onclick="goForward()">R</div>
  </div>

</div>

<script src="index.js"></script>
</body>
</html>
